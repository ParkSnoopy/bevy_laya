[package]
name = "bevy-laya"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false, features = ["std", "multi_threaded"] }
burn-laya = { git = "https://github.com/ParkSnoopy/burn-laya", version = "0.1" }

# ============================================
# RUST-MAGIC-LINTER (standard preset)
# https://github.com/vicnaum/rust-magic-linter
# ============================================
# ============================================
# STANDARD PRESET
# ============================================
# The viral tweet config enhanced with async safety
# Recommended for most projects
#
# Based on @notnotstorm's tweet + OpenAgentsInc additions

[lints.clippy]
# Enable pedantic group for comprehensive checks
pedantic = { level = "warn", priority = -1 }

# === THE GUARDRAILS (Critical for AI Agents) ===
# Panic safety - agents must handle errors, not crash
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"

# The "no cheating" rule
allow_attributes = "deny"

# Code hygiene - no debug leftovers
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# === ASYNC SAFETY ===
await_holding_lock = "deny"       # Prevents deadlocks

# === PROCESS SAFETY ===
exit = "deny"                     # Libraries shouldn't exit

# === PEDANTIC RELAXATIONS ===
# These are too noisy for most projects
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

[dev-dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
serde_json = "1"

# Flex tensor kernels need optimization for checkpoint inference tests.
[profile.test]
opt-level = 3
